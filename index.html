<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>The 6-Month Debut Aniversary Album — Music Player</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #11110f;
      color: #f5f1e8;
      font-synthesis: none;
      --muted: #8d8b84;
      --line: #33322e;
      --accent: #fecf67;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 28%, rgb(90 79 54 / 19%), transparent 46%),
        #11110f;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
      padding: 28px 0 32px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
    }
    .brand { color: var(--accent); font-weight: 800; }
    .tag-label { display: flex; align-items: center; gap: 8px; }
    .tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgb(254 207 103 / 70%);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, .88fr);
      gap: clamp(40px, 8vw, 96px);
      align-items: center;
      padding: clamp(42px, 8vh, 82px) 0 58px;
    }
    .cover-wrap { width: min(100%, 440px); margin: auto; }
    .cover {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
      background: #fff url("cover.png") center / cover no-repeat;
      box-shadow: 0 24px 75px rgb(0 0 0 / 45%);
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
    }
    .artist-logo {
      display: block;
      width: min(100%, 280px);
      height: auto;
      margin: 0 0 20px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(29px, 3.6vw, 40px);
      font-weight: 400;
      letter-spacing: -.045em;
    }
    .description {
      margin: 10px 0 30px;
      color: var(--muted);
      font-size: 13px;
    }
    .track-list { display: grid; gap: 2px; }
    .track {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 58px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      border-top: 0;
      border-left: 0;
      border-right: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    .track:first-child { border-top: 1px solid var(--line); }
    .track.is-active {
      color: #f5f1e8;
      background: rgb(254 207 103 / 6%);
      box-shadow: inset 2px 0 var(--accent);
    }
    @media (hover: hover) {
      .track:hover:not(:disabled) {
        color: var(--accent);
        background: rgb(254 207 103 / 10%);
      }
    }
    .track:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .track:disabled { cursor: default; opacity: .48; }
    .track-number { color: var(--accent); font-size: 11px; }
    .track-name { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

    .timeline { margin-top: 27px; }
    .time-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      border-radius: 99px;
      background: var(--line);
      accent-color: var(--accent);
      cursor: pointer;
    }
    input[type="range"]:disabled { cursor: default; opacity: .45; }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 23px;
      margin: 22px 0 27px;
    }
    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .icon-button:hover:not(:disabled), .icon-button.is-on { color: var(--accent); }
    .icon-button:disabled { cursor: default; opacity: .35; }
    .icon-button svg { width: 18px; height: 18px; }
    .play-button {
      width: 58px;
      height: 58px;
      background: var(--accent);
      color: #171910;
    }
    .play-button:hover:not(:disabled) { color: #171910; background: #ffe0a0; }
    .play-button svg { width: 22px; height: 22px; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: #68675f;
      font-size: 9px;
      letter-spacing: .12em;
    }

    @media (max-width: 700px) {
      .page { width: min(100% - 36px, 450px); padding-top: 20px; }
      main { grid-template-columns: 1fr; gap: 35px; padding: 36px 0 42px; }
      .cover-wrap { width: min(82%, 330px); }
      .cover-title { font-size: clamp(48px, 14vw, 68px); }
      .description { margin-bottom: 22px; }
      footer { font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="cover-wrap">
        <div class="cover" role="img" aria-label="アルバムジャケット：黄色いハートに白い文字「わ」が描かれた画像"></div>
      </div>

      <section aria-labelledby="album-title">
        <img class="artist-logo" src="logo.png" alt="mikiya" width="1194" height="476">
        <h1 id="album-title">The 6-Month Debut Aniversary Album</h1>
        <p class="description">弾き語りを始めて6か月、おめでとう!<br>これからも楽しい音楽ライフを過ごしてね!</p>

        <div class="track-list" id="track-list" aria-label="曲一覧"></div>

        <div class="timeline">
          <div class="time-labels">
            <span id="elapsed">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置" disabled>
        </div>

        <div class="controls" aria-label="再生コントロール">
          <button class="icon-button" id="previous" type="button" aria-label="前の曲" title="前の曲" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14M19 6l-10 6 10 6V6Z"/></svg>
          </button>
          <button class="icon-button play-button" id="play" type="button" aria-label="再生" title="再生" disabled>
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l9 6.2a1.1 1.1 0 0 1 0 1.8l-9 6.2c-.7.4-1.6-.1-1.6-.9V5.8Z"/></svg>
          </button>
          <button class="icon-button" id="next" type="button" aria-label="次の曲" title="次の曲" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14M5 6l10 6-10 6V6Z"/></svg>
          </button>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>

    <footer>
      <span>MADE FOR SLOW MOMENTS</span>
      <span>PLAY YOUR OWN MUSIC</span>
    </footer>
  </div>

  <script>
    (() => {
      const audio = document.querySelector("#audio");
      const trackList = document.querySelector("#track-list");
      const playButton = document.querySelector("#play");
      const playIcon = document.querySelector("#play-icon");
      const previousButton = document.querySelector("#previous");
      const nextButton = document.querySelector("#next");
      const seek = document.querySelector("#seek");
      const elapsed = document.querySelector("#elapsed");
      const durationLabel = document.querySelector("#duration");
      const tracks = [
        { days: 150, filename: "Your Song(藤井風Ver.).mp3" },
        { days: 120, filename: "刻在我心底的名字.mp3" },
        { days: 108, filename: "3月9日.mp3" },
        { days: 90, filename: "Your Song.mp3" },
        { days: 62, filename: "Shape of you.mp3" },
        { days: 41, filename: "突然好想你.mp3" }
      ].map(({ days, filename }) => ({
        name: `${days}日：${filename.replace(/\.[^.]+$/, "")}`,
        url: `music/${encodeURIComponent(filename)}`,
        duration: 0
      }));
      let currentIndex = -1;

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${remainder}`;
      };

      const renderTracks = () => {
        trackList.replaceChildren();
        for (let index = 0; index < tracks.length; index += 1) {
          const track = tracks[index];
          const button = document.createElement("button");
          button.type = "button";
          button.className = `track${index === currentIndex ? " is-active" : ""}`;
          button.disabled = !track;
          button.setAttribute("aria-label", `${index + 1}曲目 ${track.name} を再生`);
          button.innerHTML = `<span class="track-number">${String(index + 1).padStart(2, "0")}</span><span class="track-name"></span>`;
          button.querySelector(".track-name").textContent = track.name;
          button.addEventListener("click", () => loadTrack(index, true));
          trackList.append(button);
        }
        const hasTracks = tracks.length > 0;
        playButton.disabled = !hasTracks;
        previousButton.disabled = !hasTracks;
        nextButton.disabled = !hasTracks;
        seek.disabled = currentIndex < 0;
      };

      const loadTrack = (index, shouldPlay = false) => {
        if (!tracks[index]) return;
        currentIndex = index;
        audio.src = tracks[index].url;
        elapsed.textContent = "0:00";
        durationLabel.textContent = formatTime(tracks[index].duration);
        seek.value = "0";
        renderTracks();
        if (shouldPlay) {
          audio.play().catch((error) => console.error("Audio playback failed.", error));
        }
      };

      const playNext = () => {
        if (tracks.length === 0) return;
        const nextIndex = (currentIndex + 1) % tracks.length;
        loadTrack(nextIndex, true);
      };

      playButton.addEventListener("click", () => {
        if (currentIndex < 0 && tracks.length) loadTrack(0);
        if (audio.paused) {
          audio.play().catch((error) => console.error("Audio playback failed.", error));
        } else {
          audio.pause();
        }
      });

      previousButton.addEventListener("click", () => {
        if (!tracks.length) return;
        const previousIndex = currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1;
        loadTrack(previousIndex, true);
      });
      nextButton.addEventListener("click", playNext);

      seek.addEventListener("input", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
        }
      });
      audio.addEventListener("loadedmetadata", () => {
        if (currentIndex < 0) return;
        tracks[currentIndex].duration = audio.duration;
        durationLabel.textContent = formatTime(audio.duration);
        renderTracks();
      });
      audio.addEventListener("timeupdate", () => {
        elapsed.textContent = formatTime(audio.currentTime);
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          seek.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
        }
      });
      audio.addEventListener("play", () => {
        playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
        playButton.setAttribute("aria-label", "一時停止");
        playButton.title = "一時停止";
        renderTracks();
      });
      audio.addEventListener("pause", () => {
        playIcon.innerHTML = '<path d="M8 5.8c0-.8.9-1.3 1.6-.9l9 6.2a1.1 1.1 0 0 1 0 1.8l-9 6.2c-.7.4-1.6-.1-1.6-.9V5.8Z"/>';
        playButton.setAttribute("aria-label", "再生");
        playButton.title = "再生";
      });
      audio.addEventListener("ended", playNext);
      audio.addEventListener("error", () => {
        if (audio.currentSrc) console.error("Audio file could not be loaded.", audio.error);
      });

      renderTracks();
      loadTrack(0);
    })();
  </script>
</body>
</html>
